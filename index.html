<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f0ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Типаж">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Типаж — личный стилист</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f0ea;--card:#fffdf9;--ink:#1c1a18;--mute:#86807a;--line:#e3ddd4;--acc:#1c1a18;--gold:#b08a4e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Manrope',system-ui,sans-serif}
#app{max-width:520px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 18px 60px}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,.serif{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;letter-spacing:.01em}
.top{display:flex;justify-content:space-between;align-items:center;padding:4px 0 10px}
.logo{font:700 22px 'Cormorant Garamond',serif;letter-spacing:.32em}
.lnk{background:none;border:0;font-size:13px;color:var(--mute);text-decoration:underline;text-underline-offset:3px}
.kick{font:600 11px 'Manrope',sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
.btn{display:block;width:100%;min-height:54px;margin-top:12px;border:0;border-radius:999px;background:var(--ink);color:#fff;font:600 14px 'Manrope',sans-serif;letter-spacing:.14em;text-transform:uppercase}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn[disabled]{opacity:.3}
.hero{position:relative;border-radius:22px;overflow:hidden;background:#e9e2d8;margin-top:6px}
.hero svg{display:block;width:100%;height:auto}
.prog{height:2px;background:var(--line);margin:4px 0 22px}.prog i{display:block;height:100%;background:var(--ink);transition:width .3s}
.q h2{font-size:34px;line-height:1.08;margin:6px 0 6px}
.q p.s{color:var(--mute);margin:0 0 18px}
.opts{display:grid;gap:10px}
.opts.g2{grid-template-columns:1fr 1fr}.opts.g3{grid-template-columns:1fr 1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 14px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);text-align:left;transition:border-color .2s,transform .15s}
.opt:active{transform:scale(.98)}
.opt.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.opt small{display:block;color:var(--mute);font-size:12.5px;line-height:1.35}
.opt .sw{flex:0 0 30px;height:30px;border-radius:50%;border:1px solid rgba(0,0,0,.08)}
.opt.fig{flex-direction:column;justify-content:flex-start;text-align:center;padding:12px 6px 10px}
.opt.fig svg{width:64px;height:100px}
.opt.fig b{font-size:13px;font-weight:600}
.num{display:flex;gap:10px;align-items:center}
.num input{flex:1;height:56px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);font:600 22px 'Manrope';padding:0 16px;width:100%}
.card{background:var(--card);border-radius:20px;padding:18px;margin-top:14px;border:1px solid var(--line)}
.card h3{margin:0 0 6px;font-size:26px;line-height:1.1}
.res-top{text-align:center;padding:18px 0 4px}
.res-top h1{font-size:44px;line-height:1;margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{padding:6px 12px;border-radius:999px;background:#efe9e1;font-size:12.5px;font-weight:600}
.pal{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}
.pal div{aspect-ratio:1;border-radius:10px;position:relative;border:1px solid rgba(0,0,0,.06)}
.pal.neu{grid-template-columns:repeat(4,1fr)}
.pal.av div:after{content:'';position:absolute;left:10%;right:10%;top:50%;height:2px;background:#fff;transform:rotate(-35deg);box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.pname{font-size:12px;color:var(--mute);margin-top:6px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:16px -18px 0;padding:0 18px 4px;scrollbar-width:none;position:sticky;top:0;background:var(--bg);z-index:3;padding-top:8px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;padding:9px 15px;border-radius:999px;border:1.5px solid var(--line);background:transparent;font-weight:600;font-size:13px}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
ul.do,ul.dont{margin:8px 0 0;padding:0;list-style:none}
ul.do li,ul.dont li{padding:7px 0 7px 26px;position:relative;border-bottom:1px solid var(--line)}
ul.do li:last-child,ul.dont li:last-child{border-bottom:0}
ul.do li:before{content:'✓';position:absolute;left:2px;color:#3e7a4e;font-weight:700}
ul.dont li:before{content:'✕';position:absolute;left:2px;color:#b04a3a;font-weight:700}
.kv{display:grid;grid-template-columns:96px 1fr;gap:6px 12px;margin-top:8px;font-size:14px}
.kv b{font-weight:600;color:var(--mute);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding-top:2px}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .ic{flex:0 0 58px;height:58px;border-radius:14px;background:#f1ebe2;display:flex;align-items:center;justify-content:center}
.item .ic svg{width:46px;height:46px}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-weight:600}
.item .tx span{font-size:12.5px;color:var(--mute)}
.shops{display:flex;gap:6px;margin-top:6px}
.shops a{font-size:11.5px;font-weight:700;letter-spacing:.06em;padding:5px 9px;border-radius:999px;border:1px solid var(--ink);color:var(--ink);text-decoration:none}
.look{background:var(--card);border:1px solid var(--line);border-radius:22px;margin-top:14px;overflow:hidden}
.look .board{background:#efe8de;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:16px;position:relative}
.look .board div{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.55);border-radius:14px}
.look .board svg{width:78%;height:78%}
.look .lt{padding:14px 16px}
.look .lt h3{margin:0;font-size:24px}
.look .lt p{margin:4px 0 8px;color:var(--mute);font-size:13px}
.look .row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:13.5px}
.look .row a{white-space:nowrap;margin-left:10px;font-size:11.5px;font-weight:700;color:var(--ink)}
.drape{position:relative;width:250px;height:250px;margin:10px auto 0;border-radius:50%;overflow:hidden}
.drape img{position:absolute;inset:34px;width:182px;height:182px;object-fit:cover;border-radius:50%}
.drape .ring{position:absolute;inset:0;border-radius:50%}
.dp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.dp button{border:1.5px solid var(--line);border-radius:18px;background:var(--card);padding:10px 6px}
.dp button.on{border-color:var(--ink)}
.dp .mini{position:relative;width:120px;height:120px;margin:0 auto;border-radius:50%;overflow:hidden}
.dp .mini img{position:absolute;inset:18px;width:84px;height:84px;object-fit:cover;border-radius:50%}
.note{font-size:12.5px;color:var(--mute);text-align:center;margin-top:18px;line-height:1.5}
.fade{animation:fd .35s ease}@keyframes fd{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.sec{display:flex;gap:4px;margin:2px 0 18px}.sec i{flex:1;height:3px;border-radius:2px;background:var(--line)}.sec i.on{background:var(--ink)}.sec i.done{background:#9a928a}
.opt .il{flex:0 0 52px;height:40px;display:flex;align-items:center;justify-content:center}.opt .il svg{width:52px;height:40px}
.skip{display:block;margin:14px auto 0;background:none;border:0;color:var(--mute);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.hint{background:#ebe4da;border-radius:14px;padding:10px 14px;font-size:13px;color:#5a544e;margin:-6px 0 16px;line-height:1.45}
.prefill{font-size:12px;color:#3e7a4e;font-weight:600;margin:-8px 0 12px}
.pbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pbtns label{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:84px;border-radius:18px;border:1.5px solid var(--ink);font-weight:600;font-size:14px;cursor:pointer;background:var(--card)}
.pbtns label span{font-size:24px}
.pcwrap{overflow:auto;max-height:52vh;border-radius:16px;background:#ddd5ca;-webkit-overflow-scrolling:touch}
.pcwrap canvas{display:block;touch-action:manipulation}
.ptgt{display:flex;align-items:center;gap:10px;margin:12px 0 8px;padding:10px 12px;border-radius:14px;background:var(--ink);color:#fff;font-size:14px}
.ptgt b{font-weight:700}.ptgt small{opacity:.7;display:block;font-size:12px}
.pts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pts span{display:flex;align-items:center;gap:6px;padding:5px 10px 5px 5px;border-radius:999px;background:#efe9e1;font-size:12px;font-weight:600}
.pts i{width:20px;height:20px;border-radius:50%;border:1px solid rgba(0,0,0,.1)}
.zoom{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}.zoom button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700}.zoom button.on{background:var(--ink);color:#fff}
.yy{position:relative;height:34px;margin:14px 4px 4px}
.yy .bar{position:absolute;left:0;right:0;top:14px;height:6px;border-radius:3px;background:linear-gradient(90deg,#d9a0b0,#e8e0d4 50%,#5a6070)}
.yy .dot{position:absolute;top:7px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:var(--ink);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.yy .l{position:absolute;top:-6px;font-size:10.5px;font-weight:700;letter-spacing:.12em;color:var(--mute)}
.secs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.secs div{background:#f1ebe2;border-radius:12px;padding:8px;text-align:center;font-size:12px}.secs b{display:block;font-size:13.5px}
.cel{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.cel:last-child{border-bottom:0}
.mono{flex:0 0 62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 22px 'Cormorant Garamond',serif;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.cel .tx{flex:1;min-width:0}.cel .tx b{display:block;font-size:15.5px}
.pct{font:700 20px 'Cormorant Garamond',serif}
.why{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}.why span{font-size:11px;padding:3px 8px;border-radius:999px;background:#efe9e1;font-weight:600}
.sbtn{margin-top:8px;border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700}
.seg{display:flex;background:#e9e2d8;border-radius:999px;padding:3px;margin-top:12px}.seg button{flex:1;border:0;background:none;border-radius:999px;padding:8px;font-size:12.5px;font-weight:700}.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.src{font-size:12.5px;color:var(--mute);margin:6px 0 0;padding-left:18px}.src li{margin:4px 0}
.alt{font-size:12.5px;color:var(--mute);margin-top:6px}
.item .ic{flex:0 0 74px!important;height:86px!important;background:#f1ebe2!important}.item .ic svg{width:66px!important;height:78px!important}
.look .board{display:block!important;padding:0!important;aspect-ratio:auto!important}
.look .board>div{display:none}
.pbtns label svg{width:26px;height:26px}

button,a{touch-action:manipulation}
html{-webkit-text-size-adjust:100%}
.ihint{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:15;background:#1c1a18;color:#fff;border-radius:14px;padding:12px 44px 12px 14px;font-size:13.5px;line-height:1.45;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.ihint button{position:absolute;right:6px;top:6px;width:36px;height:36px;border:0;background:none;font-size:20px;color:#fff;cursor:pointer}
</style>
</head>

function kibbe(){const cnt=keys=>{const c={A:0,B:0,C:0,D:0,E:0,n:0};keys.forEach(k=>{const v=A[k];if(v&&v!=='X'){c[v]++;c.n++}});return c};
 const bone=cnt(['k1','k2','k3','k4']),flesh=cnt(['k5','k6','k7','k8','k9']),fb=cnt(['k10','k11','k12']),ff=cnt(['k13','k14','k15']);
 const h=A.height||0,tall=A.sex==='f'?h>=173:h>=186,petite=A.sex==='f'?h<=161:h<=173;
 if(tall){bone[bone.B>bone.A?'B':'A']++;bone.n++}else if(petite){bone[bone.E>bone.D?'E':'D']++;bone.n++}
 const yang=c=>c.A+c.B,yin=c=>c.D+c.E;const n=Math.max(1,bone.n);
 let bf;if(bone.C>=Math.max(yang(bone),yin(bone))&&bone.C>=n*.35)bf='C';else if(yang(bone)&&yin(bone)&&Math.min(yang(bone),yin(bone))>=n*.3)bf='G';else if(yang(bone)>yin(bone))bf=bone.A>=bone.B?'D':'N';else if(yin(bone)>yang(bone))bf='R';else bf='C';
 const fy=(yin(flesh)-yang(flesh))/Math.max(1,flesh.n),ffy=(yin(ff)-yang(ff))/Math.max(1,ff.n);const all=[bone,flesh,fb,ff];const T=all.reduce((s,c)=>s+c.n,0)||1;const yy=all.reduce((s,c)=>s+c.A+c.B*.7-c.D*.7-c.E,0)/T;
 let id;if(bf==='D')id=(fy>.2||(fy>0&&ffy>.3))?'SD':'D';else if(bf==='N')id=fy>.2?'SN':'FN';else if(bf==='C')id=yy>0?'DC':'SC';else if(bf==='G')id=yy>=0?'FG':'SG';else id=(bone.A+fb.A>=2)?'TR':'R';
 const lab=c=>{if(!c.n)return '—';const y=yang(c),i=yin(c);return c.C>=Math.max(y,i)?'баланс':y&&i&&Math.min(y,i)>=c.n*.3?'смешанный':y>i?(c.A>=c.B?'острый ян':'широкий ян'):'мягкий инь'};
 return {id,yy:clamp(yy),secs:[['Скелет',lab(bone)],['Тело',lab(flesh)],['Черты',lab({A:fb.A+ff.A,B:fb.B+ff.B,C:fb.C+ff.C,D:fb.D+ff.D,E:fb.E+ff.E,n:fb.n+ff.n})]]}}

function buildCaps(){const S=SEASONS[R.season];const items=CAPS[R.sex][R.life];const cut=CUT[R.sex][R.shape]||{};let ni=0,ai=0,li=0;const used=[];
 const lights=S.col.filter(x=>light(x[0])).concat(S.neu.filter(x=>light(x[0])));const accents=S.col.filter(x=>!light(x[0]));
 R.caps=items.map(it=>{const[slot,icon,name,q,f,role]=it;let col;
  if(role==='n'){col=S.neu[(slot==='outer'||slot==='shoes'||slot==='acc'?[3,2,1,0]:[1,3,0,2])[ni++%4]];if(slot==='outer'||slot==='layer'){let k=0;while((used.includes(col[0])||light(col[0]))&&k<4){col=S.neu[(S.neu.indexOf(col)+1)%4];k++}used.push(col[0])}}
  else if(role==='l'){col=(lights.length?lights:S.col)[li++%(lights.length||S.col.length)]}else{col=(accents.length?accents:S.col)[ai++%(accents.length||S.col.length)]}

function makeLooks(C,names,N){const by=s=>C.filter(x=>x.slot===s);const tops=by('top'),bots=by('bottom'),dres=by('dress'),lay=by('layer'),out=by('outer'),sh=by('shoes'),acc=by('acc');const L=[];
 for(let i=0;i<N;i++){const f=[3,3,2,2,1,1][i%6];const pickF=(arr,k)=>{if(!arr.length)return null;const s=arr.slice().sort((a,b)=>Math.abs((a.f||2)-f)-Math.abs((b.f||2)-f));return s[(k||0)%s.length]};
  const useDress=dres.length&&(i===1||i===3||(!tops.length));const items=[];
  if(useDress)items.push(pickF(dres,i));else{items.push(pickF(tops,i));items.push(pickF(bots,i))}
  if(i%2===0||f===3)items.push(pickF(lay,i));if(i===0||i===N-1)items.push(pickF(out,0));items.push(pickF(sh,i));if(acc.length)items.push(pickF(acc,i));
  L.push({n:names[i%names.length],items:items.filter(Boolean).filter((x,j,a)=>a.indexOf(x)===j)})}return L}

  const pt=(list,a,b,w,txt)=>{if(!a||!b)return;if(a===b){sc+=w;why.push(txt)}else{const d=dE(lab(list,a),lab(list,b));if(d<25)sc+=w*(1-d/25)*.6}};

 if(TAB==='how')b=`<div class="card"><span class="kick">Типаж</span><h3>Система Дэвида Кибби</h3><p style="margin:6px 0 0">Американский стилист Дэвид Кибби в книге «Metamorphosis» (1987) описал типажи как баланс «инь» (мягкость, округлость) и «ян» (острота, прямые линии). Тест делится на блоки: скелет, мягкие ткани тела и черты лица; скелет важнее всего — он определяет, как сидит одежда. Позже Кибби сократил систему до 10 типажей, убрав «чистые» классик, гамин и натурал.</p>
  <p style="margin:8px 0 0">Как считаем: ответы A–E (острый ян → широкий ян → баланс → мелкий инь → мягкий инь) суммируются по блокам. Скелет даёт семью, ткани и черты — подтип. Рост сдвигает вертикаль.</p></div>
  <div class="card"><span class="kick">Цвет</span><h3>12 сезонов</h3><p style="margin:6px 0 0">Система 12 сезонов (Sci\\ART, Кэтрин Калиш) описывает окраску тремя осями по Манселлу: тон (тёплый–холодный), светлота (светлый–тёмный), насыщенность (яркий–мягкий). Ведущая ось определяет сезон: например, «светлое лето» — светлота ведущая, тон холодный.</p>
  <p style="margin:8px 0 0">Как считаем: ответы анкеты, замер цвета по фото (кожа, волосы, радужка с поправкой баланса белого по белку глаза) и выбор в тесте с рамками сводятся в три числа, затем находим ближайший из 12 эталонов.</p></div>
  <div class="card"><span class="kick">Ограничения</span><p style="margin:6px 0 0">Это ориентир, а не диагноз. Профессиональный анализ цвета делают при нейтральном свете с тканевыми драпировками; фото зависит от камеры и освещения. Типажи знаменитостей — по книге Кибби и распространённым разборам, цветотипы звёзд — примерные.</p>
  <ul class="src"><li>D. Kibbe, «Metamorphosis: Discover Your Image Identity», 1987</li><li>K. Kalisz, Sci\\ART 12-season system, ~2000</li><li>A. Munsell, Munsell Color System (тон, светлота, насыщенность)</li></ul></div>`;
