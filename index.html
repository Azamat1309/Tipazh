<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f0ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Типаж">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Типаж — личный стилист</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f0ea;--card:#fffdf9;--ink:#1c1a18;--mute:#86807a;--line:#e3ddd4;--acc:#1c1a18;--gold:#b08a4e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Manrope',system-ui,sans-serif}
#app{max-width:520px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 18px 60px}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,.serif{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;letter-spacing:.01em}
.top{display:flex;justify-content:space-between;align-items:center;padding:4px 0 10px}
.logo{font:700 22px 'Cormorant Garamond',serif;letter-spacing:.32em}
.lnk{background:none;border:0;font-size:13px;color:var(--mute);text-decoration:underline;text-underline-offset:3px}
.kick{font:600 11px 'Manrope',sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
.btn{display:block;width:100%;min-height:54px;margin-top:12px;border:0;border-radius:999px;background:var(--ink);color:#fff;font:600 14px 'Manrope',sans-serif;letter-spacing:.14em;text-transform:uppercase}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn[disabled]{opacity:.3}
.hero{position:relative;border-radius:22px;overflow:hidden;background:#e9e2d8;margin-top:6px}
.hero svg{display:block;width:100%;height:auto}
.prog{height:2px;background:var(--line);margin:4px 0 22px}.prog i{display:block;height:100%;background:var(--ink);transition:width .3s}
.q h2{font-size:34px;line-height:1.08;margin:6px 0 6px}
.q p.s{color:var(--mute);margin:0 0 18px}
.opts{display:grid;gap:10px}
.opts.g2{grid-template-columns:1fr 1fr}.opts.g3{grid-template-columns:1fr 1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 14px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);text-align:left;transition:border-color .2s,transform .15s}
.opt:active{transform:scale(.98)}
.opt.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.opt small{display:block;color:var(--mute);font-size:12.5px;line-height:1.35}
.opt .sw{flex:0 0 30px;height:30px;border-radius:50%;border:1px solid rgba(0,0,0,.08)}
.opt.fig{flex-direction:column;justify-content:flex-start;text-align:center;padding:12px 6px 10px}
.opt.fig svg{width:64px;height:100px}
.opt.fig b{font-size:13px;font-weight:600}
.num{display:flex;gap:10px;align-items:center}
.num input{flex:1;height:56px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);font:600 22px 'Manrope';padding:0 16px;width:100%}
.card{background:var(--card);border-radius:20px;padding:18px;margin-top:14px;border:1px solid var(--line)}
.card h3{margin:0 0 6px;font-size:26px;line-height:1.1}
.res-top{text-align:center;padding:18px 0 4px}
.res-top h1{font-size:44px;line-height:1;margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{padding:6px 12px;border-radius:999px;background:#efe9e1;font-size:12.5px;font-weight:600}
.pal{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}
.pal div{aspect-ratio:1;border-radius:10px;position:relative;border:1px solid rgba(0,0,0,.06)}
.pal.neu{grid-template-columns:repeat(4,1fr)}
.pal.av div:after{content:'';position:absolute;left:10%;right:10%;top:50%;height:2px;background:#fff;transform:rotate(-35deg);box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.pname{font-size:12px;color:var(--mute);margin-top:6px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:16px -18px 0;padding:0 18px 4px;scrollbar-width:none;position:sticky;top:0;background:var(--bg);z-index:3;padding-top:8px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;padding:9px 15px;border-radius:999px;border:1.5px solid var(--line);background:transparent;font-weight:600;font-size:13px}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
ul.do,ul.dont{margin:8px 0 0;padding:0;list-style:none}
ul.do li,ul.dont li{padding:7px 0 7px 26px;position:relative;border-bottom:1px solid var(--line)}
ul.do li:last-child,ul.dont li:last-child{border-bottom:0}
ul.do li:before{content:'✓';position:absolute;left:2px;color:#3e7a4e;font-weight:700}
ul.dont li:before{content:'✕';position:absolute;left:2px;color:#b04a3a;font-weight:700}
.kv{display:grid;grid-template-columns:96px 1fr;gap:6px 12px;margin-top:8px;font-size:14px}
.kv b{font-weight:600;color:var(--mute);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding-top:2px}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .ic{flex:0 0 58px;height:58px;border-radius:14px;background:#f1ebe2;display:flex;align-items:center;justify-content:center}
.item .ic svg{width:46px;height:46px}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-weight:600}
.item .tx span{font-size:12.5px;color:var(--mute)}
.shops{display:flex;gap:6px;margin-top:6px}
.shops a{font-size:11.5px;font-weight:700;letter-spacing:.06em;padding:5px 9px;border-radius:999px;border:1px solid var(--ink);color:var(--ink);text-decoration:none}
.look{background:var(--card);border:1px solid var(--line);border-radius:22px;margin-top:14px;overflow:hidden}
.look .board{background:#efe8de;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:16px;position:relative}
.look .board div{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.55);border-radius:14px}
.look .board svg{width:78%;height:78%}
.look .lt{padding:14px 16px}
.look .lt h3{margin:0;font-size:24px}
.look .lt p{margin:4px 0 8px;color:var(--mute);font-size:13px}
.look .row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:13.5px}
.look .row a{white-space:nowrap;margin-left:10px;font-size:11.5px;font-weight:700;color:var(--ink)}
.drape{position:relative;width:250px;height:250px;margin:10px auto 0;border-radius:50%;overflow:hidden}
.drape img{position:absolute;inset:34px;width:182px;height:182px;object-fit:cover;border-radius:50%}
.drape .ring{position:absolute;inset:0;border-radius:50%}
.dp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.dp button{border:1.5px solid var(--line);border-radius:18px;background:var(--card);padding:10px 6px}
.dp button.on{border-color:var(--ink)}
.dp .mini{position:relative;width:120px;height:120px;margin:0 auto;border-radius:50%;overflow:hidden}
.dp .mini img{position:absolute;inset:18px;width:84px;height:84px;object-fit:cover;border-radius:50%}
.note{font-size:12.5px;color:var(--mute);text-align:center;margin-top:18px;line-height:1.5}
.fade{animation:fd .35s ease}@keyframes fd{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

button,a{touch-action:manipulation}
html{-webkit-text-size-adjust:100%}
.ihint{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:15;background:#1c1a18;color:#fff;border-radius:14px;padding:12px 44px 12px 14px;font-size:13.5px;line-height:1.45;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.ihint button{position:absolute;right:6px;top:6px;width:36px;height:36px;border:0;background:none;font-size:20px;color:#fff;cursor:pointer}
</style>
</head>

 const hg=A.height||0,tall=A.sex==='f'?hg>=172:hg>=186,short=A.sex==='f'?hg<162:hg<174;const sc={D:0,N:0,C:0,G:0,R:0};

 ({sharp:{D:2,G:.5},bal:{C:2},soft:{R:2,N:.5},mixed:{G:2,N:.5}})[A.lines||'bal']&&Object.entries(({sharp:{D:2,G:.5},bal:{C:2},soft:{R:2,N:.5},mixed:{G:2,N:.5}})[A.lines||'bal']).forEach(([k,x])=>sc[k]+=x);
 ({narrow:{R:1,G:.5,D:.5},medium:{C:1},wide:{N:2,D:.5}})[A.bone||'medium']&&Object.entries(({narrow:{R:1,G:.5,D:.5},medium:{C:1},wide:{N:2,D:.5}})[A.bone||'medium']).forEach(([k,x])=>sc[k]+=x);

function buildCaps(){const S=SEASONS[R.season];const items=CAPS[R.sex][R.life];const cut=CUT[R.sex][R.shape]||{};let ni=0,ai=0,li=0;
 const lights=S.col.filter(x=>light(x[0])).concat(S.neu.filter(x=>light(x[0])));const accents=S.col.filter(x=>!light(x[0]));
 R.caps=items.map((it,i)=>{const[slot,icon,name,q,f,role]=it;let col;
  if(role==='n'){col=S.neu[(slot==='outer'||slot==='shoes'||slot==='acc'?[3,2,1,0]:[1,3,0,2])[ni++%4]]}else if(role==='l'){col=(lights.length?lights:S.col)[li++%(lights.length||S.col.length)]}else{col=(accents.length?accents:S.col)[ai++%(accents.length||S.col.length)]}
  if(role==='n'&&(slot==='outer'||slot==='layer')){const used=R._ul||(R._ul=[]);let k=0;while((used.includes(col[0])||light(col[0]))&&k<4){col=S.neu[(S.neu.indexOf(col)+1)%4];k++}used.push(col[0])}
  const cu=cut[icon]||cut[slot]||'';return {slot,icon,name,q,f,col,cut:cu,query:`${q} ${cu} ${col[1]}`.replace(/\s+/g,' ').trim()}});
 delete R._ul;R.looks=makeLooks();store.set('tp_r',R)}
function makeLooks(){const C=R.caps;const by=s=>C.filter(x=>x.slot===s);const tops=by('top'),bots=by('bottom'),dres=by('dress'),lay=by('layer'),out=by('outer'),sh=by('shoes'),acc=by('acc');const names=SCEN[R.life];const L=[];
 for(let i=0;i<6;i++){const f=[3,3,2,2,1,1][i];const pickF=(arr,k)=>{if(!arr.length)return null;const s=arr.slice().sort((a,b)=>Math.abs(a.f-f)-Math.abs(b.f-f));return s[(k||0)%s.length]};
  const useDress=R.sex==='f'&&dres.length&&(i===3||i===4);const items=[];
  if(useDress)items.push(pickF(dres,i));else{items.push(pickF(tops,i));items.push(pickF(bots,i))}
  if(i%2===0||f===3)items.push(pickF(lay,i));if(i===0||i===5)items.push(pickF(out,0));items.push(pickF(sh,i));if(acc.length)items.push(pickF(acc,i));
  L.push({n:names[i],items:items.filter(Boolean).filter((x,j,a)=>a.indexOf(x)===j)})}return L}

 <h1 style="font-size:46px;line-height:1;margin:22px 0 8px">Ваш стиль — по вашей внешности</h1>
 <p style="color:var(--mute);margin:0">15 вопросов о фигуре, внешности и образе жизни. В конце — цветотип и палитра, тип фигуры, стилевой типаж, капсульный гардероб и готовые образы со ссылками на вещи.</p>
 <div class="card" style="font-size:14px"><div class="kv"><b>Время</b><span>5–7 минут</span><b>Понадобится</b><span>зеркало, дневной свет, по желанию — селфи</span><b>Данные</b><span>всё хранится только на вашем телефоне</span></div></div>
 <button class="btn" onclick="STEP=0;rStep()">${R?'Пройти заново':'Начать'}</button></div>`}
function rRes(){if(!R){go('intro');return}const S=SEASONS[R.season],SH=SHAPES[R.sex][R.shape],T=TYPES[R.type],F=FACES[R.face];
 const tabs=[['sum','Типаж'],['col','Цвета'],['fig','Фигура'],['wr','Гардероб'],['lk','Образы'],['hair','Прическа']];let b='';
 if(TAB==='sum')b=`<div class="card"><span class="kick">Цветотип</span><h3>${S.n}</h3><p style="margin:4px 0 0">${S.d}</p><div class="pal">${S.col.slice(0,6).map(x=>`<div style="background:${x[0]}"></div>`).join('')}</div></div>
  <div class="card"><span class="kick">Стилевой типаж</span><h3>${T.n}</h3><div class="chips">${T.k.split(' · ').map(x=>`<span class="chip">${x}</span>`).join('')}</div><p style="margin:10px 0 0">${T.d}</p></div>
  <div class="card"><span class="kick">Фигура</span><h3>${SH.n}</h3><p style="margin:4px 0 0">${SH.d}</p></div>

 if(TAB==='col')b=`<div class="card"><span class="kick">Ваша палитра · ${S.g}</span><h3>${S.n}</h3><p style="margin:4px 0 0">${S.d}</p><div class="pal">${S.col.map(x=>`<div style="background:${x[0]}" title="${x[1]}"></div>`).join('')}</div><p class="pname">${S.col.map(x=>x[1]).join(' · ')}</p></div>
  <div class="card"><span class="kick">База гардероба</span><div class="pal neu">${S.neu.map(x=>`<div style="background:${x[0]}"></div>`).join('')}</div><p class="pname">${S.neu.map(x=>x[1]).join(' · ')}</p></div>
  <div class="card"><span class="kick">Лучше избегать у лица</span><div class="pal neu av">${S.avoid.map(x=>`<div style="background:${x[0]}"></div>`).join('')}</div><p class="pname">${S.avoid.map(x=>x[1]).join(' · ')}</p></div>
  <div class="card"><div class="kv"><b>Металл</b><span>${S.metal}</span><b>Правило</b><span>самые выигрышные цвета носите у лица — рубашки, свитеры, шарфы. Нелюбимые можно носить внизу.</span></div></div>`;
 if(TAB==='fig')b=`<div class="card" style="display:flex;gap:16px;align-items:center"><div style="flex:0 0 70px">${fig(R.shape,R.sex)}</div><div><span class="kick">Тип фигуры</span><h3>${SH.n}</h3><p style="margin:4px 0 0">${SH.d}</p></div></div>
  <div class="card"><span class="kick">Работает</span><ul class="do">${SH.do.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="card"><span class="kick">Лучше избегать</span><ul class="dont">${SH.dont.map(x=>`<li>${x}</li>`).join('')}</ul></div>
  <div class="card"><span class="kick">Стилевой типаж · ${T.n}</span><div class="kv"><b>Ткани</b><span>${T.fab}</span><b>Узоры</b><span>${T.pat}</span><b>Крой</b><span>${T.cut}</span><b>Детали</b><span>${T.acc}</span></div></div>`;
 if(TAB==='wr')b=`<div class="card"><span class="kick">Капсула · ${{office:'офис',smart:'smart casual',casual:'на каждый день',creative:'творческая'}[R.life]}</span><h3>${R.caps.length} вещей, ${R.looks.length} образов</h3><p style="margin:4px 0 0;color:var(--mute);font-size:13px">Цвета — из вашей палитры, крой — под фигуру. Ссылки открывают поиск в магазине.</p>
  ${R.caps.map(x=>`<div class="item"><div class="ic">${ic(x.icon,x.col[0])}</div><div class="tx"><b>${x.name}</b><span>${x.col[1]}${x.cut?' · '+x.cut:''}</span>${shops(x.query)}</div></div>`).join('')}</div>`;
 if(TAB==='lk')b=R.looks.map((L,i)=>`<div class="look"><div class="board">${L.items.slice(0,6).map(x=>`<div>${ic(x.icon,x.col[0])}</div>`).join('')}</div><div class="lt"><span class="kick">Образ ${i+1}</span><h3>${L.n}</h3><p>${L.items.map(x=>x.col[1]).filter((v,j,a)=>a.indexOf(v)===j).join(' + ')}</p>${L.items.map(x=>`<div class="row"><span>${x.name} · ${x.col[1]}</span><a href="${SHOP.wb(x.query)}" target="_blank" rel="noopener">найти →</a></div>`).join('')}</div></div>`).join('');
 if(TAB==='hair')b=`<div class="card"><span class="kick">Форма лица</span><h3>${F.n}</h3><p style="margin:4px 0 0">${R.sex==='f'?F.hf:F.hm}</p><div class="kv"><b>Очки</b><span>${F.gl}</span></div></div>
  <div class="card"><span class="kick">Под типаж · ${T.n}</span><p style="margin:4px 0 0">${R.sex==='f'?T.hairF:T.hairM}</p></div>
  <div class="card"><span class="kick">Если окрашивать</span><p style="margin:4px 0 0">${({Весна:'тёплые светлые оттенки: золотистый, медовый, карамельный',Лето:'холодные мягкие: пепельный, жемчужный, холодный русый',Осень:'тёплые глубокие: каштановый, медный, шоколадный',Зима:'холодные чёткие: тёмный шоколад, чёрный, холодный тёмный'})[S.g]}. Не уходите далеко от натурального цвета — он гармоничнее всего с кожей и глазами.</p></div>`;
 app.innerHTML=`<div class="${TAB==='sum'?'fade':''}"><div class="top"><span class="logo">ТИПАЖ</span><button class="lnk" onclick="STEP=0;rStep()">Пройти заново</button></div>
 <div class="res-top"><span class="kick">Ваш типаж</span><h1>${S.n} · ${T.n}</h1><span style="color:var(--mute)">${SH.n}</span></div>
 <div class="tabs">${tabs.map(([k,n])=>`<button class="${TAB===k?'on':''}" onclick="TAB='${k}';rRes()">${n}</button>`).join('')}</div>${b}
 <p class="note">Подбор по анкете и цветовому тесту — ориентир, а не диагноз. Финально цвет проверяйте у лица при дневном свете.</p></div>`;const ot=app.querySelector('.tabs .on');if(ot)ot.scrollIntoView({inline:'center',block:'nearest'})}
